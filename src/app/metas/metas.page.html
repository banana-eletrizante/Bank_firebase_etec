<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title>Metas</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="abrirModalMeta()">
        <ion-icon name="add-circle-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content color="primary">
  <div class="ion-padding">
    
    <div class="welcome-section" *ngIf="metas.length === 0">
      <p style="color: white; opacity: 0.6; text-align: center; margin-top: 20px;">
        Nenhuma meta cadastrada. Clique no ícone de "+" para adicionar.
      </p>
    </div>

    <ion-card *ngFor="let m of metas" class="actions-card ion-no-margin ion-margin-bottom">
      <ion-card-content>
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <h2 style="color: white; font-weight: bold; margin: 0; font-size: 1.2rem;">{{ m.titulo }}</h2>
            <p style="color: rgba(255,255,255,0.7); margin: 5px 0;">
              Objetivo: R$ {{ m.alvo | number:'1.2-2' }}
            </p>
          </div>
          <ion-button fill="clear" color="danger" (click)="excluirMeta(m.id)">
            <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </div>

        <div style="margin-top: 15px;">
          <ion-progress-bar 
            [value]="m.atual / m.alvo" 
            color="success" 
            style="height: 10px; border-radius: 5px;">
          </ion-progress-bar>
          <div style="display: flex; justify-content: space-between; margin-top: 5px;">
            <span style="color: white; font-size: 0.8rem;">{{ (m.atual / m.alvo) * 100 | number:'1.0-0' }}%</span>
            <span style="color: white; font-size: 0.8rem;">R$ {{ m.atual | number:'1.2-2' }} de R$ {{ m.alvo | number:'1.2-2' }}</span>
          </div>
        </div>
      </ion-card-content>
    </ion-card>

  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <ion-tab-bar slot="bottom" color="primary">
    <ion-tab-button tab="home" routerLink="/home">
      <ion-icon name="speedometer-outline"></ion-icon>
      <ion-label>Dashboard</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="transacoes" routerLink="/transacoes">
      <ion-icon name="wallet-outline"></ion-icon>
      <ion-label>Transações</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="metas" routerLink="/metas" class="tab-selected">
      <ion-icon name="pie-chart-outline"></ion-icon>
      <ion-label>Metas</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="configuracoes" routerLink="/configuracoes">
      <ion-icon name="settings-outline"></ion-icon>
      <ion-label>Ajustes</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-footer>
